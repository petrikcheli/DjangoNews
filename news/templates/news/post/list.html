{% extends "base.html" %}

{% block title %}Новости{% endblock %}

{% block content %}
    <h1>Новости</h1>    
    {% for post in posts %}
        <h2>
            <a href="{% url 'news:post_detail' post.id %}">
                {{ post.title }}
            </a>
        </h2>
        <p class="date">
            Published {{ post.publish }} by {{ post.author }}
        </p>
        
    {% endfor %}
{% endblock %}
